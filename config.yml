vintage: "2026.05"

inputs:
  bmf: "s3://nccsdata/geocoding/bmf-master/merged/bmf_master_geocoded.parquet"
  # 990combined for 1989-2011 (only file available); carries Pt IX 5+7 inline.
  core_legacy: "s3://nccsdata/processed_legacy/core/"
  # 990combined (intersection 990+990EZ) and 990 (full, with Pt IX 5/6/7/8/9)
  # for 2012-2024. The reader joins them by (ein, tax_year).
  core_modern: "s3://nccsdata/processed/core/"
  # 990-PF only — single form, no intersection issue; processed_merged is fine.
  core_pf: "s3://nccsdata/processed_merged/core/"

  # efile Phase 0 vertical slice (ADR 0017): two filing-grain metric tables.
  # government_grants = Form 990 Pt VIII line 1e (grants RECEIVED, 990 only);
  # program_related_investments_total = Form 990-PF Pt IX-B aggregate (990-PF
  # only). Reads phase0/latest; coverage TY2020-2024 upstream, but this repo
  # publishes only the complete years (see year_ranges.gov_grants / pf_pri).
  efile:
    gov_grants: "s3://nccsdata/processed/efile/phase0/latest/government_grants.parquet"
    pf_pri:     "s3://nccsdata/processed/efile/phase0/latest/program_related_investments.parquet"

  daf:
    orgs:
      2021: "https://nccs-efile.s3.us-east-1.amazonaws.com/public/efile_v2_1/SD-P01-T00-ORGS-DONOR-ADVISED-FUNDS-OTH-2021.CSV"
      2022: "https://nccs-efile.s3.us-east-1.amazonaws.com/public/efile_v2_1/SD-P01-T00-ORGS-DONOR-ADVISED-FUNDS-OTH-2022.CSV"
      2023: "https://nccs-efile.s3.us-east-1.amazonaws.com/public/efile_v2_1/SD-P01-T00-ORGS-DONOR-ADVISED-FUNDS-OTH-2023.CSV"
      2024: "https://nccs-efile.s3.us-east-1.amazonaws.com/public/efile_v2_1/SD-P01-T00-ORGS-DONOR-ADVISED-FUNDS-OTH-2024.CSV"

output:
  bucket: "nccsdata"
  prefix: "sector-in-brief"
  sandbox_prefix: "sector-in-brief-sandbox"
  also_publish_latest: true

year_ranges:
  number_nonprofits: [1989, 2026]
  finances:          [1989, 2024]
  pf_grants:         [1989, 2024]
  # efile-derived panels (gov_grants, pf_pri, daf). Completeness rule:
  #   - Start year is always 2021 (e-file coverage is complete from 2021 on).
  #   - Upper bound is the most recent tax year whose record count is within
  #     +/-5% of the prior year's. nccs-efile publishes everything available;
  #     this consumer trims to the years that are complete enough for the
  #     dashboard. Re-evaluate at each vintage (e.g. 2024 currently has far
  #     fewer records than 2023, so it is excluded).
  gov_grants:        [2021, 2023]
  pf_pri:            [2021, 2023]
  daf:               [2021, 2023]

lookups:
  cbsa_crosswalk: "inst/lookups/cbsa_crosswalk.parquet"

aws:
  profile: "thiya"
  region: "us-east-1"

local:
  cache_dir: ".cache"
  fixtures_dir: "inst/fixtures"
